<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Interactive Spartan Helmet & Floating Training Armour Scene
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 7.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lighting: Cinematic Crimson Rim & Metallic Key Lights
const ambientLight = new THREE.AmbientLight(0x1a1a24, 2.0);
scene.add(ambientLight);

const redRimLeft = new THREE.DirectionalLight(0xe60026, 6.0);
redRimLeft.position.set(-6, 3, 2);
scene.add(redRimLeft);

const redRimRight = new THREE.DirectionalLight(0xff1744, 7.0);
redRimRight.position.set(6, -2, -1);
scene.add(redRimRight);

const metallicKeyLight = new THREE.DirectionalLight(0xdde3ea, 4.0);
metallicKeyLight.position.set(2, 6, 5);
scene.add(metallicKeyLight);

const pointGlow = new THREE.PointLight(0xe60026, 4.0, 15);
pointGlow.position.set(0, 0, 2);
scene.add(pointGlow);

// Materials
const darkMetalMat = new THREE.MeshStandardMaterial({
    color: 0x1f2127,
    metalness: 0.85,
    roughness: 0.3,
});

const silverTrimMat = new THREE.MeshStandardMaterial({
    color: 0xc4c9d4,
    metalness: 0.9,
    roughness: 0.2,
});

const crimsonEnergyMat = new THREE.MeshStandardMaterial({
    color: 0xe60026,
    emissive: 0x990014,
    emissiveIntensity: 0.8,
    metalness: 0.6,
    roughness: 0.25,
});

// Build 3D Spartan Warrior Helmet Group
const spartanGroup = new THREE.Group();

// 1. Helmet Dome (Cranial shell)
const domeGeo = new THREE.SphereGeometry(1.6, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.58);
const dome = new THREE.Mesh(domeGeo, darkMetalMat);
dome.position.y = 0.2;
spartanGroup.add(dome);

// 2. Helmet Crest / Ridge (High mohawk plume spine)
const crestCurve = new THREE.CylinderGeometry(0.18, 0.18, 3.2, 16);
crestCurve.rotateX(Math.PI / 2);
const crestSpine = new THREE.Mesh(crestCurve, silverTrimMat);
crestSpine.position.set(0, 1.85, -0.2);
crestSpine.scale.set(0.8, 1.0, 1.25);
spartanGroup.add(crestSpine);

// Crest Plume (Crimson Spartan Mohawk Fin)
const plumeGeo = new THREE.BoxGeometry(0.12, 1.1, 3.4);
const plume = new THREE.Mesh(plumeGeo, crimsonEnergyMat);
plume.position.set(0, 2.3, -0.2);
spartanGroup.add(plume);

// 3. Face Plate & Cheeks (Angular Spartan Visor)
const cheekLeftGeo = new THREE.BoxGeometry(0.2, 1.6, 1.2);
const cheekLeft = new THREE.Mesh(cheekLeftGeo, darkMetalMat);
cheekLeft.position.set(-1.15, -0.6, 0.45);
cheekLeft.rotation.set(0.15, 0.2, -0.15);
spartanGroup.add(cheekLeft);

const cheekRight = new THREE.Mesh(cheekLeftGeo, darkMetalMat);
cheekRight.position.set(1.15, -0.6, 0.45);
cheekRight.rotation.set(0.15, -0.2, 0.15);
spartanGroup.add(cheekRight);

// 4. Iconic T-Shaped Nose & Brow Guard
const browGeo = new THREE.BoxGeometry(2.3, 0.35, 0.4);
const brow = new THREE.Mesh(browGeo, silverTrimMat);
brow.position.set(0, 0.45, 1.55);
spartanGroup.add(brow);

const noseGuardGeo = new THREE.BoxGeometry(0.35, 1.7, 0.35);
const noseGuard = new THREE.Mesh(noseGuardGeo, crimsonEnergyMat);
noseGuard.position.set(0, -0.35, 1.58);
spartanGroup.add(noseGuard);

// 5. Orbiting Metallic Energy Rings (Spartan Strength Rings)
const ringGeo = new THREE.TorusGeometry(2.8, 0.05, 16, 100);
const ring1 = new THREE.Mesh(ringGeo, silverTrimMat);
ring1.rotation.x = Math.PI / 3;
spartanGroup.add(ring1);

const ring2 = new THREE.Mesh(ringGeo, crimsonEnergyMat);
ring2.rotation.y = Math.PI / 2.6;
ring2.scale.set(1.15, 1.15, 1.15);
spartanGroup.add(ring2);

// Floating Iron Weight Plates in Background Depth
const plateGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.22, 24);
const plate1 = new THREE.Mesh(plateGeo, darkMetalMat);
plate1.position.set(-3.2, 1.8, -2.0);
plate1.rotation.set(0.6, 0.4, 0.2);
spartanGroup.add(plate1);

const plate2 = new THREE.Mesh(plateGeo, darkMetalMat);
plate2.position.set(3.4, -1.6, -1.8);
plate2.rotation.set(-0.5, 0.8, -0.3);
spartanGroup.add(plate2);

scene.add(spartanGroup);

// Mouse interaction tracking
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

// Resize handler
window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

// Render Loop
let clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();

    // Smooth inertia tracking
    targetX += (mouseX - targetX) * 0.05;
    targetY += (mouseY - targetY) * 0.05;

    // Subtle breathing float and mouse yaw/pitch
    spartanGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.18;
    spartanGroup.rotation.y = elapsedTime * 0.35 + targetX * 0.75;
    spartanGroup.rotation.x = Math.sin(elapsedTime * 0.8) * 0.08 - targetY * 0.45;

    // Orbiting rings counter-rotation
    ring1.rotation.z += 0.008;
    ring2.rotation.x += 0.012;
    ring2.rotation.y += 0.006;

    // Weight plates ambient float
    plate1.rotation.y += 0.01;
    plate2.rotation.z += 0.01;

    renderer.render(scene, camera);
}

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
